<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" font-family="Noto Sans, Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Fragrance Castle operations film: build and render pipeline</title>
  <desc id="d">Design inputs (requirements, the site layout and five feasibility spikes) feed four asset work packages, which compose one USD stage. Each shot is baked from the world state of the previous shot with posture IK, a solved grasp library and suction attach. A validator checks every frame. Only a shot that passes, with a matching bake hash, goes to the Isaac Sim renderer. Failed shots go back to the bake. The renderer writes 1080p frames, and ffmpeg cuts the 120 s film. Three robots act in the film: G2-H with five-finger hands, G2-S with a suction tool, and an AMR with a tray trolley.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5b6472"/>
    </marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#c2410c"/>
    </marker>
    <style>
      .box{fill:#ffffff;stroke:#c9d1dc;stroke-width:1.5}
      .in{fill:#eef5ff;stroke:#7aa7e0}
      .core{fill:#fff7e8;stroke:#e3a33b;stroke-width:2}
      .sim{fill:#eefaf2;stroke:#5bb57c}
      .off{fill:#f4f1fb;stroke:#9a83cf}
      .t{font-size:17px;font-weight:700;fill:#1f2733}
      .s{font-size:13px;fill:#4a5462}
      .l{font-size:12.5px;fill:#5b6472}
      .grp{font-size:13px;font-weight:700;fill:#8a93a1;letter-spacing:1px}
      .e{stroke:#5b6472;stroke-width:1.6;fill:none;marker-end:url(#a)}
      .fail{stroke:#c2410c;stroke-width:1.6;fill:none;stroke-dasharray:6 4;marker-end:url(#r)}
      .fl{font-size:12.5px;font-weight:700;fill:#c2410c}
    </style>
  </defs>

  <!-- DESIGN -->
  <text x="20" y="34" class="grp">DESIGN</text>
  <rect x="20" y="46" width="240" height="78" rx="10" class="box in"/>
  <text x="36" y="74" class="t">Needs + requirements</text>
  <text x="36" y="96" class="s">V-model: N1–N6, R1–R8</text>
  <text x="36" y="114" class="l">payload, reach, end effectors</text>
  <rect x="20" y="138" width="240" height="78" rx="10" class="box in"/>
  <text x="36" y="166" class="t">Site layout</text>
  <text x="36" y="188" class="s">one Python file, frozen</text>
  <text x="36" y="206" class="l">SCDF fire code, exit distances</text>
  <rect x="20" y="230" width="240" height="78" rx="10" class="box in"/>
  <text x="36" y="258" class="t">Feasibility spikes</text>
  <text x="36" y="280" class="s">5 spikes, GO before build</text>
  <text x="36" y="298" class="l">hand, suction, render cost, glass</text>

  <!-- BUILD -->
  <text x="320" y="34" class="grp">BUILD</text>
  <rect x="320" y="46" width="250" height="196" rx="12" class="box off"/>
  <text x="336" y="74" class="t">Asset work packages</text>
  <text x="336" y="100" class="s">C1  shell, site, office, staff</text>
  <text x="336" y="122" class="s">C2  warehouse + packing line</text>
  <text x="336" y="144" class="s">C3  luxury boutique</text>
  <text x="336" y="166" class="s">C4  robots + shared props</text>
  <text x="336" y="200" class="l">every asset: pytest + a QA</text>
  <text x="336" y="218" class="l">turntable still, checked by eye</text>
  <rect x="320" y="262" width="250" height="78" rx="12" class="box off"/>
  <text x="336" y="290" class="t">Scene assembly</text>
  <text x="336" y="312" class="s">one OpenUSD stage, site.usda</text>
  <text x="336" y="330" class="l">instanced stock, 31,200 boxes</text>

  <!-- ANIMATE AND CHECK -->
  <text x="630" y="34" class="grp">ANIMATE + CHECK</text>
  <rect x="630" y="46" width="260" height="170" rx="14" class="box core"/>
  <text x="650" y="76" class="t">Shot bake</text>
  <text x="650" y="102" class="s">world state flows shot to shot</text>
  <text x="650" y="124" class="s">posture IK with keep-out terms</text>
  <text x="650" y="146" class="s">solved grasp library (13)</text>
  <text x="650" y="168" class="s">suction attach, kinematic rig</text>
  <text x="650" y="200" class="l">FK = PhysX to 0.003 mm</text>
  <rect x="630" y="262" width="260" height="196" rx="14" class="box core"/>
  <text x="650" y="292" class="t">Validator, every frame</text>
  <text x="650" y="318" class="s">voxel collision + thin-mesh test</text>
  <text x="650" y="340" class="s">arm vs arm, arm vs props</text>
  <text x="650" y="362" class="s">IK residual &gt; 10 mm = FAIL</text>
  <text x="650" y="384" class="s">joint flips, speed limits</text>
  <text x="650" y="406" class="s">no same-camera time jumps</text>
  <text x="650" y="440" class="l">zero exemptions</text>

  <!-- RENDER -->
  <text x="950" y="34" class="grp">RENDER</text>
  <rect x="950" y="46" width="230" height="78" rx="12" class="box sim"/>
  <text x="966" y="74" class="t">Render gate</text>
  <text x="966" y="96" class="s">PASS + bake hash match</text>
  <text x="966" y="114" class="l">a dirty shot never renders</text>
  <rect x="950" y="146" width="230" height="130" rx="12" class="box sim"/>
  <text x="966" y="176" class="t">Isaac Sim 6.0.1</text>
  <text x="966" y="200" class="s">RTX real-time path tracing</text>
  <text x="966" y="220" class="s">1080p, 24 fps, 32 subframes</text>
  <text x="966" y="240" class="s">12 bounces on glass shots</text>
  <text x="966" y="264" class="l">GPU lock + job watchdog</text>
  <rect x="950" y="298" width="230" height="96" rx="12" class="box sim"/>
  <text x="966" y="326" class="t">Edit</text>
  <text x="966" y="348" class="s">ffmpeg cut, 16 shots, 120 s</text>
  <text x="966" y="368" class="s">review sheet + strips</text>
  <text x="966" y="386" class="l">checked frame by frame</text>

  <!-- ROBOTS -->
  <text x="20" y="500" class="grp">ROBOTS IN THE FILM</text>
  <rect x="20" y="512" width="360" height="104" rx="12" class="box"/>
  <text x="36" y="542" class="t">G2-H  ·  five-finger hands</text>
  <text x="36" y="566" class="s">AgiBot G2 + two Shadow Hand E3M5</text>
  <text x="36" y="588" class="l">cartons, cardboard, packing, testers</text>
  <rect x="410" y="512" width="360" height="104" rx="12" class="box"/>
  <text x="426" y="542" class="t">G2-S  ·  suction tool</text>
  <text x="426" y="566" class="s">AgiBot G2 + bellows cup, valve block</text>
  <text x="426" y="588" class="l">perfume boxes: unload, shelve, pick</text>
  <rect x="800" y="512" width="380" height="104" rx="12" class="box"/>
  <text x="816" y="542" class="t">AMR  ·  tray trolley</text>
  <text x="816" y="566" class="s">one 0.80 m tray deck, three trays</text>
  <text x="816" y="588" class="l">racks → packing → linkway → boutique</text>

  <!-- edges -->
  <path d="M260 85 L 320 110" class="e"/>
  <path d="M260 177 L 320 160" class="e"/>
  <path d="M260 269 C 290 269, 290 205, 320 205" class="e"/>
  <path d="M445 242 L 445 262" class="e"/>
  <path d="M570 300 C 600 300, 600 130, 630 130" class="e"/>
  <path d="M760 216 L 760 262" class="e"/>
  <path d="M890 330 C 920 330, 920 85, 950 85" class="e"/>
  <path d="M1065 124 L 1065 146" class="e"/>
  <path d="M1065 276 L 1065 298" class="e"/>
  <path d="M630 420 C 590 420, 590 190, 630 190" class="fail"/>
  <text x="520" y="430" class="fl">FAIL: re-bake</text>
</svg>
